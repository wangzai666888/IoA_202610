# Stop the three-member simulator before starting this service on port 8090.
services:
  simulator:
    image: ioa-simulator:five
    build:
      context: ../../simulator
      dockerfile: Dockerfile
    command: ["python", "-m", "simulator.service", "--host", "0.0.0.0", "--scenario", "/app/simulator/scenarios/five_team.json", "--auth-file", "/run/simulator/auth.json", "--output-dir", "/app/outputs"]
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - type: bind
        source: ../../simulator/service_auth_five.local.json
        target: /run/simulator/auth.json
        read_only: true
        bind:
          create_host_path: false
      - ../../simulator/outputs:/app/outputs
      - ../../simulator/scenarios:/app/simulator/scenarios:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 6
    networks:
      default:
        aliases:
          - ioa-simulator
networks:
  default:
    name: agent_network
    external: true
