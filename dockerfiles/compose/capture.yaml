# Start the existing ioa-server and Milvus first. Run from the project root.
# Each role's private env file is generated by: python3 -m simulator.prepare_ioa
services:
  observer:
    image: ioa-client:sim
    container_name: capture-observer-client
    env_file:
      - .env
      - ../../simulator/observer.local.env
    environment:
      CUSTOM_CONFIG: configs/cases/capture/observer.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/capture/observer/database:/app/database
      - ../../configs/client_configs:/app/configs:ro
    ports:
      - "127.0.0.1:5060:5050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/openapi.json', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  leader:
    image: ioa-client:sim
    container_name: capture-leader-client
    env_file:
      - .env
      - ../../simulator/leader.local.env
    environment:
      CUSTOM_CONFIG: configs/cases/capture/leader.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/capture/leader/database:/app/database
      - ../../configs/client_configs:/app/configs:ro
    ports:
      - "127.0.0.1:5061:5050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/openapi.json', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  marker:
    image: ioa-client:sim
    container_name: capture-marker-client
    env_file:
      - .env
      - ../../simulator/marker.local.env
    environment:
      CUSTOM_CONFIG: configs/cases/capture/marker.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/capture/marker/database:/app/database
      - ../../configs/client_configs:/app/configs:ro
    ports:
      - "127.0.0.1:5062:5050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/openapi.json', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  default:
    name: agent_network
    external: true
